name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'dangdai-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dangdai-pwa/package-lock.json

      - name: Install dependencies
        working-directory: dangdai-pwa
        run: npm ci

      - name: Build PWA
        working-directory: dangdai-pwa
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dangdai-pwa/dist
          output_location: ''
          skip_app_build: true
